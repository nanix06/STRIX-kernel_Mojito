name: STRIX-bxx-KernelSu-clang

on:
  workflow_dispatch:
    inputs:
      clang_version:
        description: "ZyC Clang 23 ou plus : '23' ou 'main' (= derniere, actuellement 23.0.0git)"
        required: true
        default: "main"

permissions:
  contents: read

env:
  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: vendor/mojito_defconfig
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_COMPAT: arm-linux-gnueabi-
  CLANG_VER: ${{ inputs.clang_version || 'main' }}
  MAKE_ARGS: >-
    CC=clang
    HOSTCC=clang
    HOSTCXX=clang++
    LD=ld.lld
    HOSTLD=ld.lld
    AR=llvm-ar
    NM=llvm-nm
    OBJCOPY=llvm-objcopy
    OBJDUMP=llvm-objdump
    READELF=llvm-readelf
    STRIP=llvm-strip
    CLANG_TRIPLE=aarch64-linux-gnu-
    CROSS_COMPILE=aarch64-linux-gnu-
    CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
    LLVM_IAS=1
    KCFLAGS=-Wno-error

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Télécharger le source
        uses: actions/checkout@v4
        with:
          ref: inline-rom
          fetch-depth: 1
          submodules: recursive

      - name: Installer les dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache flex git libssl-dev \
            libelf-dev pahole patch python3 rsync unzip wget zip jq \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Installer ZyC Clang (ZyCromerZ/Clang)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # ZyC Clang : toolchain LLVM complet (clang, lld, llvm-ar, ...) deja
          # compile, distribue en archives tar.gz via les releases GitHub.
          # Le depot publie un fichier Clang-<version>-link.txt qui pointe
          # toujours vers la derniere archive de cette version majeure.
          BASE="https://raw.githubusercontent.com/ZyCromerZ/Clang/main"
          LINK="$BASE/Clang-${CLANG_VER}-link.txt"

          # GitHub (raw.githubusercontent / CDN des releases) renvoie parfois
          # des 503 : on retente, on reprend les telechargements interrompus
          # (curl -C -) et on bascule sur l'API GitHub puis des miroirs si le
          # CDN officiel reste indisponible.
          fetch() {
            local url="$1" out="$2" i rc
            shift 2
            for i in $(seq 1 6); do
              curl -fsSL --retry 4 --retry-all-errors --retry-delay 5 \
                --connect-timeout 30 "$@" -o "$out" "$url" && return 0
              rc=$?
              echo "Echec (code $rc) sur $url, tentative $i/6..."
              sleep $((i * 5))
            done
            return 1
          }

          download() {
            local url="$1" out="$2" i rc tries="${TRIES:-8}"
            shift 2
            for i in $(seq 1 "$tries"); do
              curl -fL --retry 5 --retry-all-errors --retry-delay 5 \
                --connect-timeout 30 --max-time 3600 \
                -C - "$@" -o "$out" "$url" && return 0
              rc=$?
              # 22/33/416 : erreur HTTP, reprise non supportee ou fichier complet
              if [ "$rc" -eq 22 ] || [ "$rc" -eq 33 ] || [ "$rc" -eq 416 ]; then
                rm -f "$out"
              fi
              echo "Telechargement echoue (code $rc), tentative $i/$tries, pause $((i * 5))s..."
              sleep $((i * 5))
            done
            return 1
          }

          # Telecharge puis verifie l'archive : seules les archives valides sont
          # acceptees (un miroir peut renvoyer une page d'erreur en HTTP 200).
          try_url() {
            local url="$1" out="$2"
            shift 2
            rm -f "$out.part"
            download "$url" "$out.part" "$@" || return 1
            if tar -tzf "$out.part" > /dev/null 2>&1; then
              mv "$out.part" "$out"
              return 0
            fi
            echo "Archive invalide depuis $url, on essaie autre chose."
            rm -f "$out.part"
            return 1
          }

          if ! fetch "$LINK" /tmp/zyc-link.txt; then
            echo "Pas de Clang-${CLANG_VER}-link.txt, repli sur 'main' (derniere version)"
            fetch "$BASE/Clang-main-link.txt" /tmp/zyc-link.txt || {
              echo "ERREUR: impossible de recuperer le lien ZyC Clang" >&2
              exit 1
            }
          fi

          URL="$(tr -d '\r\n' < /tmp/zyc-link.txt)"
          test -n "$URL" || {
            echo "ERREUR: URL ZyC Clang vide" >&2
            exit 1
          }

          # Exigence : ZyC Clang 23 minimum. Les archives 14/15/16 sont refusees.
          MAJOR="$(printf '%s' "$URL" | grep -oE 'Clang-[0-9]+' | head -n1 | tr -dc '0-9' || true)"
          if [ -n "$MAJOR" ] && [ "$MAJOR" -lt 23 ]; then
            echo "ERREUR: ZyC Clang $MAJOR < 23 (choisir '23' ou 'main')" >&2
            exit 1
          fi
          echo "Telechargement de $URL"

          mkdir -p "$GITHUB_WORKSPACE/clang"
          OUT=/tmp/zyc-clang.tar.gz
          GOT=0

          # Metadonnees de la release : id de l'asset et sha256 officiel.
          TAG="$(printf '%s' "$URL" | sed -E 's#.*/download/([^/]+)/.*#\1#')"
          RELEASE_API="https://api.github.com/repos/ZyCromerZ/Clang/releases/tags/$TAG"
          AUTH=()
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            AUTH=(-H "Authorization: Bearer $GITHUB_TOKEN")
          fi
          ASSET_JSON="$(curl -fsSL -H 'Accept: application/vnd.github+json' "${AUTH[@]}" \
            "$RELEASE_API" 2>/dev/null || true)"
          ASSET_ID="$(printf '%s' "$ASSET_JSON" \
            | jq -r '.assets[] | select(.name | endswith(".tar.gz")) | .id' 2>/dev/null \
            | head -n1 || true)"
          EXPECTED_SHA="$(printf '%s' "$ASSET_JSON" \
            | jq -r '.assets[] | select(.name | endswith(".tar.gz")) | .digest' 2>/dev/null \
            | head -n1 | sed 's/^sha256://' || true)"
          case "$EXPECTED_SHA" in
            [0-9a-f]*) ;;
            *) EXPECTED_SHA="" ;;
          esac

          # 1) URL officielle de la release.
          TRIES=4
          if try_url "$URL" "$OUT"; then
            GOT=1
          fi

          # 2) Endpoint API GitHub (different du CDN des releases).
          if [ "$GOT" -eq 0 ] && [ -n "$ASSET_ID" ]; then
            echo "Repli via l'API GitHub (asset $ASSET_ID)..."
            TRIES=3
            if try_url "https://api.github.com/repos/ZyCromerZ/Clang/releases/assets/$ASSET_ID" \
                 "$OUT" -H 'Accept: application/octet-stream'; then
              GOT=1
            fi
          fi

          # 3) Miroirs publics GitHub si le CDN officiel renvoie encore des 5xx.
          if [ "$GOT" -eq 0 ]; then
            for MIRROR in "https://ghfast.top/" "https://ghproxy.net/" "https://gh-proxy.com/" "https://github.moeyy.xyz/"; do
              echo "Repli via le miroir $MIRROR..."
              TRIES=2
              if try_url "${MIRROR}${URL}" "$OUT"; then
                GOT=1
                break
              fi
            done
          fi

          if [ "$GOT" -eq 0 ]; then
            echo "ERREUR: telechargement ZyC Clang impossible (CDN, API et miroirs)" >&2
            exit 1
          fi

          # Verifie l'integrite si GitHub a fourni un sha256.
          if [ -n "$EXPECTED_SHA" ]; then
            ACTUAL_SHA="$(sha256sum "$OUT" | awk '{print $1}')"
            if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
              echo "ERREUR: sha256 ZyC Clang invalide (attendu $EXPECTED_SHA, obtenu $ACTUAL_SHA)" >&2
              exit 1
            fi
            echo "OK: sha256 ZyC Clang verifie"
          fi

          tar -xzf "$OUT" -C "$GITHUB_WORKSPACE/clang"
          rm -f "$OUT"

          # L'archive contient normalement bin/ a la racine. Si elle est
          # emballee dans un unique sous-dossier, on remonte son contenu.
          if [ ! -x "$GITHUB_WORKSPACE/clang/bin/clang" ]; then
            ROOT="$(find "$GITHUB_WORKSPACE/clang" -mindepth 1 -maxdepth 1 -type d | head -n1)"
            if [ -n "$ROOT" ] && [ -x "$ROOT/bin/clang" ]; then
              shopt -s dotglob
              mv "$ROOT"/* "$GITHUB_WORKSPACE/clang"/
              rmdir "$ROOT"
            fi
          fi
          test -x "$GITHUB_WORKSPACE/clang/bin/clang"

          # Le Makefile (LLVM=1 / LTO clang) appelle clang, llvm-ar, ld.lld...
          # en dur : l'archive ZyC fournit deja tous ces noms sans suffixe.
          # Persiste le PATH pour toutes les etapes suivantes (config + build).
          echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          clang --version
          ld.lld --version
          llvm-ar --version | head -n1

      - name: Ajouter backslashxx KernelSU
        run: |
          git clone --depth=1 \
            https://github.com/backslashxx/KernelSU.git KernelSU
          ln -s ../KernelSU/kernel drivers/kernelsu
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          printf '\nsource "drivers/kernelsu/Kconfig"\n' >> Kconfig
          
      - name: Télécharger et appliquer les patchs SuSFS
        run: |
          git clone --depth=1 -b main https://github.com/nanix06/Patch_Ksu_SuSFS.git patches
          
          # 1. Patch du noyau
          patch -p1 --fuzz=3 < patches/Patches/SuSFS_Kernel/50_add_susfs_in_kernel-4.14.patch || true
          patch -p1 --fuzz=3 < patches/Patches/Fix/susfs_fix_statc.patch || true
          patch -p1 --fuzz=3 < patches/Patches/SuSFS_Kernel/55_try_umount_for_susfs.patch || true
          
          # 2. Patch spécifique à KernelSU
          cp patches/Patches/SuSFS_Ksu/susfs_patch_ksubxx.patch KernelSU/
          cd KernelSU
          patch -p1 < susfs_patch_ksubxx.patch || true
          cd ..

      - name: Configurer le noyau
        run: |
          mkdir -p out

          make O=out ARCH=arm64 \
            $MAKE_ARGS \
            "$DEFCONFIG"

          # KernelSU
          ./scripts/config --file out/.config --enable KSU
          ./scripts/config --file out/.config --disable KSU_KPROBES_KSUD
          ./scripts/config --file out/.config --enable CONFIG_KALLSYMS_ALL

          # SUSFS
          ./scripts/config --file out/.config --enable KSU_SUSFS
          ./scripts/config --file out/.config --enable KSU_SUSFS_HAS_MAGIC_MOUNT
          ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_PATH
          ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_KSTAT
          ./scripts/config --file out/.config --enable KSU_SUSFS_TRY_UMOUNT
          ./scripts/config --file out/.config --enable KSU_SUSFS_SPOOF_UNAME_RELEASE

          ./scripts/config --file out/.config \
            --set-str LOCALVERSION "-STRIX-HOPE"

          make O=out ARCH=arm64 \
            $MAKE_ARGS \
            olddefconfig

      - name: Compiler le noyau
        run: |
          make -j"$(nproc)" O=out ARCH=arm64 \
            $MAKE_ARGS

      - name: Préparer les fichiers
        run: |
          mkdir -p release
          cp out/arch/arm64/boot/Image release/ 2>/dev/null || true
          sha256sum release/* > release/SHA256SUMS

      - name: Envoyer l’artefact
        uses: actions/upload-artifact@v4
        with:
          name: Mojito-STRIX-KernelSU
          path: release/
          if-no-files-found: error
