name: STRIX-KsuNext-SUSFS-clang

on:
  workflow_dispatch:
    inputs:
      clang_version:
        description: "ZyC Clang 23 ou plus : '23' ou 'main' (= derniere, actuellement 23.0.0git)"
        required: true
        default: "main"

permissions:
  contents: read

env:
  ARCH: arm64
  SUBARCH: arm64
  DEFCONFIG: vendor/mojito_defconfig
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_COMPAT: arm-linux-gnueabi-
  CLANG_VER: ${{ inputs.clang_version || 'main' }}

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Télécharger le source
        uses: actions/checkout@v4
        with:
          ref: inline-rom
          fetch-depth: 1
          submodules: recursive

      - name: Installer les dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache coccinelle flex git libssl-dev \
            libelf-dev pahole patch python3 rsync unzip wget zip \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Installer ZyC Clang (ZyCromerZ/Clang)
        run: |
          set -euo pipefail

          # ZyC Clang : toolchain LLVM complet (clang, lld, llvm-ar, ...) deja
          # compile, distribue en archives tar.gz via les releases GitHub.
          # Le depot publie un fichier Clang-<version>-link.txt qui pointe
          # toujours vers la derniere archive de cette version majeure.
          BASE="https://raw.githubusercontent.com/ZyCromerZ/Clang/main"
          LINK="$BASE/Clang-${CLANG_VER}-link.txt"

          if ! curl -fsSL "$LINK" -o /tmp/zyc-link.txt; then
            echo "Pas de Clang-${CLANG_VER}-link.txt, repli sur 'main' (derniere version)"
            curl -fsSL "$BASE/Clang-main-link.txt" -o /tmp/zyc-link.txt
          fi

          URL="$(tr -d '\r\n' < /tmp/zyc-link.txt)"
          test -n "$URL" || {
            echo "ERREUR: URL ZyC Clang vide" >&2
            exit 1
          }

          # Exigence : ZyC Clang 23 minimum. Les archives 14/15/16 sont refusees.
          MAJOR="$(printf '%s' "$URL" | grep -oE 'Clang-[0-9]+' | head -n1 | tr -dc '0-9' || true)"
          if [ -n "$MAJOR" ] && [ "$MAJOR" -lt 23 ]; then
            echo "ERREUR: ZyC Clang $MAJOR < 23 (choisir '23' ou 'main')" >&2
            exit 1
          fi
          echo "Telechargement de $URL"

          mkdir -p "$GITHUB_WORKSPACE/clang"
          curl -fSL --retry 3 --retry-delay 5 -o /tmp/zyc-clang.tar.gz "$URL"
          tar -xzf /tmp/zyc-clang.tar.gz -C "$GITHUB_WORKSPACE/clang"
          rm -f /tmp/zyc-clang.tar.gz

          # L'archive contient normalement bin/ a la racine. Si elle est
          # emballee dans un unique sous-dossier, on remonte son contenu.
          if [ ! -x "$GITHUB_WORKSPACE/clang/bin/clang" ]; then
            ROOT="$(find "$GITHUB_WORKSPACE/clang" -mindepth 1 -maxdepth 1 -type d | head -n1)"
            if [ -n "$ROOT" ] && [ -x "$ROOT/bin/clang" ]; then
              shopt -s dotglob
              mv "$ROOT"/* "$GITHUB_WORKSPACE/clang"/
              rmdir "$ROOT"
            fi
          fi
          test -x "$GITHUB_WORKSPACE/clang/bin/clang"

          # Le Makefile (LLVM=1) appelle clang, llvm-ar, ld.lld... en dur :
          # l'archive ZyC fournit deja tous ces noms sans suffixe.
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          clang --version
          ld.lld --version
          llvm-ar --version | head -n1
          
      - name: Télécharger et appliquer les patchs KernelSU et SuSFS
        run: |
          git clone --depth=1 -b main https://github.com/nanix06/Patch_Ksu_SuSFS.git patches
          patch -p1 --fuzz=3 < patches/Patches/SU_kernel/patch_ksunext.patch || true
          patch -p1 --fuzz=3 < patches/Patches/SuSFS_Kernel/50_add_susfs_in_kernel-4.14.patch || true
          patch -p1 --fuzz=3 < patches/Patches/Fix/susfs_fix_statc.patch || true
          patch -p1 --fuzz=3 < patches/Patches/SuSFS_Kernel/55_try_umount_for_susfs.patch || true
          patch -p1 --fuzz=3 < patches/Patches/SU_kernel/patch_ksu_path_umount.patch || true
          sed -i 's/inotify_mark_user_mask(mark)/(mark->mask \& IN_ALL_EVENTS)/g' fs/notify/fdinfo.c
          sed -i '/^orig_flow:$/a\\t\t;' fs/notify/fdinfo.c
          sed -i '0,/^static void susfs_run_sus_path_loop(void) {/s//void susfs_run_sus_path_loop(void) {/' fs/susfs.c

      - name: Corriger l'injection initrc (hooks newfstat/fstat64 manquants)
        run: |
          # Patch fourni par le repo Patch_Ksu_SuSFS (clone dans patches/).
          #
          # Le patch kernelSU (nanix06) hooke newfstatat/fstatat64 -> ksu_handle_stat,
          # mais oublie newfstat -> ksu_handle_newfstat_ret et fstat64 -> ksu_handle_fstat64_ret.
          # Sans eux, init ne voit pas la taille reelle + accolee de init.rc, donc
          # KERNEL_SU_RC / modules.rc ne sont jamais lus, ksud post-fs-data n'est jamais
          # lance et les modules ne montent pas au boot.
          FIX=patches/Patches/Fix/patch_ksu_initrc_newfstat.patch
          test -f "$FIX" || {
            echo "ERREUR: $FIX absent (repo Patch_Ksu_SuSFS incomplet)"
            exit 1
          }
          # git apply (et non GNU patch) : le hunk fstat64 a 7 lignes de contexte avant
          # et 2 apres, GNU patch le considere alors "ancre en fin de fichier" et le
          # rejette ("Hunk #2 FAILED at 523"). git apply l'accepte avec le meme offset.
          git apply --verbose "$FIX"

          grep -q 'ksu_handle_newfstat_ret' fs/stat.c
          grep -q 'ksu_handle_fstat64_ret' fs/stat.c
          echo "OK: hooks newfstat/fstat64 presents dans fs/stat.c"   

      - name: Ajouter KernelSU-Next
        run: |
          git clone --depth=1 -b legacy https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU
          ln -s ../KernelSU/kernel drivers/kernelsu
          sed -i 's/get_monotonic_boottime(&ts)/get_monotonic_boottime64(\&ts)/' KernelSU/kernel/sulog/event.c
          sed -i '/#include <linux\/uaccess.h>/a #include <linux/timekeeping.h>' KernelSU/kernel/sulog/event.c

          bash patches/Patches/Fix/fix_sepolicy_mojito.sh KernelSU

          # NB: pas de '#define KSU_TYPE_VAL_TO_STRUCT' ici. Ce noyau 4.14 utilise encore
          # flex_array dans policydb/avtab (type_val_to_struct_array, type_attr_map_array,
          # sym_val_to_name, htable). Ce define forcerait le chemin "noyau recent" de
          # sepolicy.c et casserait la compilation (14 erreurs).
          printf '%s\n' \
            '#include "ss/avtab.h"' \
            '#include "ss/constraint.h"' \
            '#include "ss/ebitmap.h"' \
            '#include "ss/hashtab.h"' \
            '#include "ss/policydb.h"' \
            '#include "ss/services.h"' \
            '#include "ss/symtab.h"' \
            '#include <linux/gfp.h>' \
            '#include <linux/kernel.h>' \
            '#include <linux/printk.h>' \
            '#include <linux/slab.h>' \
            '#include <linux/stddef.h>' \
            '#include <linux/string.h>' \
            '#include <linux/types.h>' \
            '#include <linux/version.h>' \
            '#include <linux/vmalloc.h>' \
            | cat - KernelSU/kernel/selinux/sepolicy.c > /tmp/sepolicy.c.net \
            && mv /tmp/sepolicy.c.net KernelSU/kernel/selinux/sepolicy.c

          # KernelSU-Next legacy appelle ksu_policydb_fixup_len(), absent du sepolicy.c backslashxx
          cat >> KernelSU/kernel/selinux/sepolicy.c <<'EOF'

          int ksu_policydb_fixup_len(struct policydb *db, const char *tag)
          {
              return 0;
          }
          EOF

          cp patches/Patches/SuSFS_Ksu/susfs_patch_ksunext.patch KernelSU/
          cd KernelSU
          patch -p1 < susfs_patch_ksunext.patch || true
          cd ..

      - name: Appliquer le commit mojito_defconfig (localversion STRIX-HOPE)
        run: |
          # Commit 6bd76607aca6f77a0257e04ef4d6cea10d4b8928
          # (romgharti/kernel_xiaomi_mojito) :
          #   arch/arm64/configs/vendor/mojito_defconfig
          #   CONFIG_LOCALVERSION="-STRIX-BLISS" -> CONFIG_LOCALVERSION="-STRIX-HOPE"
          #
          # Applique via sed plutot que "git apply" : la branche inline-rom peut
          # avoir un contexte different, et seule la valeur nous interesse.
          DEF="arch/arm64/configs/$DEFCONFIG"
          test -f "$DEF" || {
            echo "ERREUR: $DEF introuvable" >&2
            exit 1
          }
          if grep -q '^CONFIG_LOCALVERSION=' "$DEF"; then
            sed -i 's/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-STRIX-HOPE"/' "$DEF"
          else
            sed -i '/^# CONFIG_LOCALVERSION is not set$/d' "$DEF"
            printf '\nCONFIG_LOCALVERSION="-STRIX-HOPE"\n' >> "$DEF"
          fi
          grep -q '^CONFIG_LOCALVERSION="-STRIX-HOPE"$' "$DEF"
          echo "OK: localversion STRIX-HOPE applique dans $DEF"

      - name: Configurer le noyau
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"

          mkdir -p out

          make O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            LLVM=1 \
            LLVM_IAS=1 \
            "$DEFCONFIG"

          # KernelSU
          ./scripts/config --file out/.config --enable KSU
          ./scripts/config --file out/.config --disable KSU_KPROBES_KSUD
          ./scripts/config --file out/.config --enable CONFIG_KALLSYMS_ALL

          # SUSFS
          ./scripts/config --file out/.config --enable KSU_SUSFS
          ./scripts/config --file out/.config --enable KSU_SUSFS_HAS_MAGIC_MOUNT
          ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_PATH
          ./scripts/config --file out/.config --disable KSU_SUSFS_SUS_MOUNT
          ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_KSTAT
          ./scripts/config --file out/.config --enable KSU_SUSFS_SUS_OVERLAYFS
          ./scripts/config --file out/.config --enable KSU_SUSFS_TRY_UMOUNT
          ./scripts/config --file out/.config --enable KSU_SUSFS_SPOOF_UNAME_RELEASE

          ./scripts/config --file out/.config \
            --set-str LOCALVERSION "-STRIX-HOPE"
          ./scripts/config --file out/.config --disable CONFIG_LOCALVERSION_AUTO

          make O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

      - name: Compiler le noyau
        run: |
          make -j"$(nproc)" O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            LLVM=1 \
            LLVM_IAS=1

      - name: Préparer les fichiers
        run: |
          mkdir -p release
          cp out/arch/arm64/boot/Image.gz release/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image.gz-dtb release/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image release/ 2>/dev/null || true
          sha256sum release/* > release/SHA256SUMS

      - name: Envoyer l’artefact
        uses: actions/upload-artifact@v4
        with:
          name: Mojito-STRIX-KernelSU
          path: release/
          if-no-files-found: error
